<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
<title id="title">Zring Mustafa — ZASTech</title><desc id="desc">Founder and CEO of ZASTech. A midnight-blue scene with an animated floating three-dimensional glass architecture and cyan light.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050914"/><stop offset=".6" stop-color="#0b1424"/><stop offset="1" stop-color="#07101d"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#087d98" stop-opacity=".36"/><stop offset="1" stop-color="#087d98" stop-opacity="0"/></radialGradient>
<linearGradient id="top" x2=".8" y2="1"><stop stop-color="#9df8ff" stop-opacity=".85"/><stop offset="1" stop-color="#126a92" stop-opacity=".45"/></linearGradient>
<linearGradient id="left" x2="1" y2="1"><stop stop-color="#167a9e" stop-opacity=".65"/><stop offset="1" stop-color="#091b36" stop-opacity=".9"/></linearGradient>
<linearGradient id="right" x2="0" y2="1"><stop stop-color="#47cbd8" stop-opacity=".5"/><stop offset="1" stop-color="#112944" stop-opacity=".9"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#9ff7f3"/><stop offset="1" stop-color="#439dce"/></linearGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="shadow" x="-50%" y="-50%" width="200%" height="250%"><feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000" flood-opacity=".6"/></filter>
<g id="cube">
<path d="M0 -90 150 -5 0 80 -150 -5Z" fill="url(#top)" stroke="#b3ffff" stroke-opacity=".7"/>
<path d="M-150 -5 0 80 0 200 -150 115Z" fill="url(#left)" stroke="#64deed" stroke-opacity=".4"/>
<path d="M0 80 150 -5 150 115 0 200Z" fill="url(#right)" stroke="#64deed" stroke-opacity=".55"/>
<path d="M-150 -5 0 80 150 -5M0 80V200" fill="none" stroke="#c4ffff" stroke-opacity=".8"/>
</g>
</defs>
<style>
.float{animation:levitate 7s ease-in-out infinite}
.signal{animation:pulse 4s ease-in-out infinite}
@keyframes levitate{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.float,.signal{animation:none}}
</style>
